<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#05070f}
#stage{position:relative;width:1920px;height:72px;overflow:hidden;font-family:'Montserrat',sans-serif;
  background:linear-gradient(90deg,#0b1c46 0%,#12275e 50%,#0b1c46 100%);
  display:flex;align-items:center;justify-content:center;gap:26px;
  border-top:2px solid rgba(231,196,107,.85);border-bottom:2px solid rgba(231,196,107,.5)}
.veins{position:absolute;inset:0;opacity:.4;mix-blend-mode:screen}
.mk{width:26px;height:26px;flex:none}
.txt{display:flex;align-items:center;gap:16px;font-weight:700;font-size:22px;color:#fff;letter-spacing:.4px;position:relative;z-index:2}
.txt .dd{color:#e7c877;font-weight:900;letter-spacing:1px}
.txt .off{color:#e7c877;font-weight:900}
.dot{width:6px;height:6px;border-radius:50%;background:#e7c877;opacity:.8}
.frete{font-weight:800;color:#8fd07a}
.timer{position:relative;z-index:2;display:inline-flex;align-items:center;gap:8px;margin-left:8px;padding:7px 16px;border-radius:9px;
  border:1.5px solid rgba(231,196,107,.6);background:rgba(6,12,30,.5)}
.timer .lb{font-weight:700;font-size:13px;letter-spacing:1.5px;color:#aebbd6;text-transform:uppercase}
.timer .num{font-weight:800;font-size:20px;color:#f0e4bf;font-variant-numeric:tabular-nums}
</style></head>
<body>
<div id="stage">
  <svg class="veins" viewBox="0 0 1920 72" preserveAspectRatio="none"><g fill="none" stroke="url(#g)" stroke-width="1"><path d="M0 20 C 400 8, 800 40, 1920 22"/><path d="M0 52 C 500 40, 1000 60, 1920 48" opacity=".6"/></g><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e7c877" stop-opacity="0"/><stop offset=".5" stop-color="#e7c877" stop-opacity=".8"/><stop offset="1" stop-color="#e7c877" stop-opacity="0"/></linearGradient></defs></svg>
  <svg class="mk" viewBox="0 0 64 64"><path d="M32 58 C 32 42 32 32 32 18" stroke="#fff" stroke-width="4.5" stroke-linecap="round" fill="none"/><path d="M32 40 C 19 41 11 33 8 20 C 23 19 33 27 32 40 Z" fill="#fff"/><path d="M32 32 C 45 33 53 25 56 12 C 41 11 31 19 32 32 Z" fill="#fff"/></svg>
  <div class="txt">
    <span class="dd">DIA D BOTANIKA</span>
    <span class="dot"></span>
    <span><span class="off">8% OFF</span> em todos os suplementos</span>
    <span class="dot"></span>
    <span class="frete">FRETE GRÁTIS</span>
    <span class="dot"></span>
    <span>Manual da Suplementação de brinde</span>
  </div>
  <div class="timer" id="timer-slot"><span class="lb">Termina em</span><span class="num">00:00:00</span></div>
</div>
</body></html>
