<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#05070f}
#stage{position:relative;width:1920px;height:600px;overflow:hidden;
  font-family:'Montserrat',sans-serif;
  background:
    radial-gradient(120% 140% at 30% 42%, #17306e 0%, #0e214f 34%, #0a1738 60%, #060d22 100%);
}
/* marble veining + texture layers */
.veins{position:absolute;inset:0;opacity:.5;mix-blend-mode:screen;pointer-events:none}
.grain{position:absolute;inset:0;opacity:.05;pointer-events:none;
  background-image:radial-gradient(#fff 1px,transparent 1px);background-size:4px 4px}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 130% at 42% 45%,transparent 46%,rgba(3,6,15,.55) 82%,rgba(2,4,10,.85) 100%)}
.rightfade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent 46%,rgba(6,11,28,.35) 68%,rgba(5,9,22,.72) 100%)}
.pool{position:absolute;left:60px;bottom:70px;width:980px;height:230px;pointer-events:none;
  background:radial-gradient(60% 80% at 50% 60%,rgba(220,178,90,.20),rgba(220,178,90,0) 70%);
  filter:blur(8px)}
.shadow{position:absolute;bottom:118px;height:34px;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.55),rgba(0,0,0,0) 72%);filter:blur(6px);z-index:1}

.prod{position:absolute;z-index:2;filter:drop-shadow(0 26px 26px rgba(0,0,0,.5))}
.prod img{display:block;height:100%;width:auto}

/* ---------- RIGHT TEXT COLUMN ---------- */
.col{position:absolute;left:1015px;top:0;width:848px;height:600px;
  display:flex;flex-direction:column;justify-content:center;gap:0}
.kick{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.kick .ln{width:46px;height:2px;background:linear-gradient(90deg,#e7c46b,#c79a3e)}
.kick span{font-weight:700;font-size:15px;letter-spacing:3.5px;color:#e6c877;text-transform:uppercase}
.h1{font-weight:900;font-size:66px;line-height:.98;letter-spacing:1px;color:#fff;text-transform:uppercase}
.h1 b{color:#e7c877;font-weight:900}
.sub{margin-top:16px;font-weight:600;font-size:27px;color:#e9eefb;letter-spacing:.2px}
.sub .off{font-weight:900;font-size:34px;
  background:linear-gradient(180deg,#f4d98a,#c89a3c);-webkit-background-clip:text;background-clip:text;color:transparent}
.benes{margin-top:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:9px;padding:10px 20px;border-radius:40px;
  background:linear-gradient(135deg,#6aa84d,#4c7f37);color:#fff;font-weight:800;font-size:18px;letter-spacing:.6px;
  box-shadow:0 8px 18px rgba(40,80,25,.35)}
.pill svg{width:16px;height:16px}
.gift{display:inline-flex;align-items:center;gap:9px;color:#e9eefb;font-weight:600;font-size:19px}
.gift .g{color:#e7c877;font-weight:900;font-size:22px;line-height:0}
/* timer reserved area */
.timerwrap{margin-top:24px}
.timerwrap .tl{font-weight:700;font-size:13px;letter-spacing:2.5px;color:#aebbd6;text-transform:uppercase;margin-bottom:8px}
.timer{display:inline-flex;align-items:center;gap:12px;padding:12px 20px;border-radius:14px;
  border:1.5px solid rgba(231,196,107,.55);background:rgba(9,17,40,.55)}
.timer .blk{display:flex;flex-direction:column;align-items:center;min-width:52px}
.timer .num{font-weight:800;font-size:30px;color:#f0e4bf;font-variant-numeric:tabular-nums;line-height:1}
.timer .lab{font-weight:600;font-size:10px;letter-spacing:1.5px;color:#8fa0c2;margin-top:5px}
.timer .cln{font-weight:800;font-size:26px;color:#e7c877;margin-top:-14px}
.cta{margin-top:26px}
.cta a{display:inline-flex;align-items:center;gap:12px;padding:17px 40px;border-radius:48px;
  background:linear-gradient(135deg,#6fae50,#4c7f37);color:#fff;font-weight:800;font-size:22px;letter-spacing:.5px;
  text-decoration:none;box-shadow:0 14px 26px rgba(40,80,25,.4)}
.cta a .arw{font-size:22px}

/* logo lockup top-right */
.logo{position:absolute;top:34px;right:44px;z-index:4;display:flex;align-items:center;gap:11px}
.logo .mk{width:34px;height:34px}
.logo .wm{font-weight:700;font-size:29px;color:#fff;letter-spacing:.3px}
/* botanical sprig */
.sprig{position:absolute;z-index:1;opacity:.85}
</style></head>
<body>
<div id="stage">
  <!-- marble veins -->
  <svg class="veins" viewBox="0 0 1920 600" preserveAspectRatio="none">
    <g fill="none" stroke="url(#gv)" stroke-width="1.2">
      <path d="M-20 120 C 300 60, 520 220, 760 150 S 1200 40, 1520 180 1980 120" opacity=".5"/>
      <path d="M-20 300 C 260 260, 480 360, 720 320 S 1180 260, 1560 340 1980 300" opacity=".35"/>
      <path d="M-20 470 C 320 430, 560 520, 900 470 S 1320 420, 1700 500 1980 470" opacity=".3"/>
    </g>
    <defs><linearGradient id="gv" x1="0" x2="1"><stop offset="0" stop-color="#d8b25a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e7c877" stop-opacity=".9"/><stop offset="1" stop-color="#d8b25a" stop-opacity="0"/></linearGradient></defs>
  </svg>
  <div class="grain"></div>
  <div class="pool"></div>

  <!-- eucalyptus sprig bottom-left -->
  <svg class="sprig" style="left:-30px;bottom:-20px;width:340px;height:300px" viewBox="0 0 340 300">
    <g stroke="#3f6f4e" stroke-width="3" fill="none" opacity=".9">
      <path d="M10 300 C 80 230, 120 180, 150 90"/>
      <path d="M60 260 C 90 250, 120 250, 150 240"/>
    </g>
    <g fill="#4b7d59" opacity=".92">
      <ellipse cx="40" cy="250" rx="26" ry="15" transform="rotate(-30 40 250)"/>
      <ellipse cx="78" cy="212" rx="26" ry="15" transform="rotate(-38 78 212)"/>
      <ellipse cx="112" cy="170" rx="24" ry="14" transform="rotate(-46 112 170)"/>
      <ellipse cx="138" cy="120" rx="22" ry="13" transform="rotate(-54 138 120)"/>
      <ellipse cx="150" cy="240" rx="20" ry="12" transform="rotate(6 150 240)"/>
      <ellipse cx="120" cy="252" rx="20" ry="12" transform="rotate(-6 120 252)"/>
    </g>
    <g fill="#5f9068" opacity=".55">
      <ellipse cx="52" cy="238" rx="18" ry="10" transform="rotate(-30 52 238)"/>
      <ellipse cx="92" cy="196" rx="18" ry="10" transform="rotate(-42 92 196)"/>
    </g>
  </svg>
  <!-- small sprig top area -->
  <svg class="sprig" style="left:820px;top:-40px;width:230px;height:210px;opacity:.6" viewBox="0 0 230 210">
    <g stroke="#3f6f4e" stroke-width="2.4" fill="none"><path d="M220 -10 C 160 40, 120 70, 90 140"/></g>
    <g fill="#4b7d59">
      <ellipse cx="180" cy="52" rx="20" ry="11" transform="rotate(40 180 52)"/>
      <ellipse cx="150" cy="86" rx="20" ry="11" transform="rotate(48 150 86)"/>
      <ellipse cx="122" cy="120" rx="18" ry="10" transform="rotate(56 122 120)"/>
    </g>
  </svg>

  <!-- gold capsules / specks -->
  <svg class="sprig" style="left:560px;bottom:40px;width:360px;height:150px;opacity:.9;z-index:3" viewBox="0 0 360 150">
    <g>
      <rect x="20" y="96" width="46" height="20" rx="10" fill="#e7c877" transform="rotate(-18 43 106)"/>
      <rect x="300" y="60" width="42" height="18" rx="9" fill="#d8b25a" transform="rotate(22 321 69)"/>
      <circle cx="150" cy="128" r="4" fill="#e7c877"/><circle cx="210" cy="118" r="3" fill="#f0d68f"/>
      <circle cx="95" cy="132" r="2.5" fill="#e7c877"/><circle cx="270" cy="110" r="3" fill="#e7c877"/>
    </g>
  </svg>

  <!-- ===== PRODUCTS ===== -->
  <!-- back row boxes -->
  <div class="shadow" style="left:120px;width:230px"></div>
  <div class="shadow" style="left:300px;width:150px"></div>
  <div class="shadow" style="left:470px;width:230px"></div>
  <div class="shadow" style="left:150px;width:250px;bottom:96px"></div>
  <div class="shadow" style="left:430px;width:300px;bottom:96px"></div>

  <div class="prod" style="left:96px;bottom:150px;height:300px;transform:rotate(-3deg)"><img src="prod/BOTANIKA_SUPER_OMEGA_CAIXA.png"></div>
  <div class="prod" style="left:352px;bottom:150px;height:372px;z-index:1"><img src="prod/CAIXA_BOTANIKA_ADEK.png"></div>
  <div class="prod" style="left:470px;bottom:150px;height:300px;transform:rotate(3deg)"><img src="prod/BOTANIKA_TRI_MG_CAIXA.png"></div>
  <!-- front row jars -->
  <div class="prod" style="left:118px;bottom:78px;height:336px;z-index:3"><img src="prod/ROTULO_BOTANIKA_WHEY_BALANCE.png"></div>
  <div class="prod" style="left:392px;bottom:78px;height:300px;z-index:3"><img src="prod/ROTULO_BOTANIKA_CREATINA.png"></div>
  <div class="prod" style="left:648px;bottom:86px;height:286px;z-index:3"><img src="prod/BOTANIKA_SUPER_VITAMINA_C_ROTULO.png"></div>

  <!-- ===== LOGO ===== -->
  <div class="logo">
    <svg class="mk" viewBox="0 0 64 64" aria-hidden="true">
      <path d="M32 58 C 32 42 32 32 32 18" stroke="#fff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M32 40 C 19 41 11 33 8 20 C 23 19 33 27 32 40 Z" fill="#fff"/>
      <path d="M32 32 C 45 33 53 25 56 12 C 41 11 31 19 32 32 Z" fill="#fff"/>
      <path d="M32 50 C 24 51 18 46 15 38 C 25 37 32 42 32 50 Z" fill="#fff" opacity=".9"/>
    </svg>
    <div class="wm">Botanika</div>
  </div>

  <!-- ===== TEXT COLUMN ===== -->
  <div class="col">
    <div class="kick"><span class="ln"></span><span>07 e 08.08 · só 2 dias</span></div>
    <div class="h1">DIA D <b>BOTANIKA</b></div>
    <div class="sub"><span class="off">8% OFF</span> em todos os suplementos</div>
    <div class="benes">
      <span class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        FRETE GRÁTIS
      </span>
      <span class="gift"><span class="g">+</span> Manual da Suplementação de brinde</span>
    </div>
    <div class="timerwrap">
      <div class="tl">A oferta termina em</div>
      <div class="timer" id="timer-slot">
        <div class="blk"><div class="num">00</div><div class="lab">HORAS</div></div>
        <div class="cln">:</div>
        <div class="blk"><div class="num">00</div><div class="lab">MIN</div></div>
        <div class="cln">:</div>
        <div class="blk"><div class="num">00</div><div class="lab">SEG</div></div>
      </div>
    </div>
    <div class="cta"><a href="#">Aproveitar agora <span class="arw">→</span></a></div>
  </div>
</div>
</body></html>
