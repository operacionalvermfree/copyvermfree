<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
#stage{position:relative;width:820px;height:340px;font-family:'Montserrat',sans-serif;
  display:flex;align-items:center;justify-content:center}
.card{position:relative;width:760px;height:280px;border-radius:26px;
  background:linear-gradient(160deg,#12275e,#0b1a45);border:1.5px solid rgba(231,196,107,.35);
  box-shadow:0 22px 50px rgba(0,0,0,.4);padding:34px 40px;display:flex;flex-direction:column;justify-content:center}
.tagline{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tagline .mk{width:24px;height:24px}
.tagline span{font-weight:800;font-size:16px;letter-spacing:3px;color:#e7c877;text-transform:uppercase}
.row{display:flex;align-items:flex-end;gap:26px}
.oldwrap{display:flex;flex-direction:column}
.olbl{font-weight:600;font-size:16px;color:#9fb0d0;letter-spacing:1px}
.old{font-weight:600;font-size:34px;color:#8ea0c2;text-decoration:line-through;text-decoration-color:#e06d6d;text-decoration-thickness:3px}
.newwrap{display:flex;flex-direction:column}
.nlbl{font-weight:700;font-size:16px;color:#cdd8ee;letter-spacing:1px}
.new{font-weight:900;font-size:70px;line-height:.9;color:#fff;letter-spacing:-1px}
.new .cents{font-size:38px;vertical-align:top;font-weight:800}
.new .rs{font-size:34px;font-weight:800;color:#e7c877;vertical-align:top;margin-right:4px}
.off{margin-left:auto;align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:132px;height:132px;border-radius:24px;background:linear-gradient(160deg,#f6dc8c,#c99a3c);color:#0b1a45;transform:rotate(4deg);
  box-shadow:0 12px 24px rgba(180,140,50,.4)}
.off .n{font-weight:900;font-size:52px;line-height:.8}
.off .p{font-weight:900;font-size:26px;line-height:.8}
.off .l{font-weight:800;font-size:14px;letter-spacing:2px;margin-top:4px}
.note{margin-top:14px;font-weight:600;font-size:14px;color:#8fd07a}
</style></head>
<body>
<div id="stage">
  <div class="card">
    <div class="tagline">
      <svg class="mk" viewBox="0 0 64 64"><path d="M32 58 C 32 42 32 32 32 18" stroke="#e7c877" stroke-width="4.5" stroke-linecap="round" fill="none"/><path d="M32 40 C 19 41 11 33 8 20 C 23 19 33 27 32 40 Z" fill="#e7c877"/><path d="M32 32 C 45 33 53 25 56 12 C 41 11 31 19 32 32 Z" fill="#e7c877"/></svg>
      <span>Preço Dia D</span>
    </div>
    <div class="row">
      <div class="newwrap">
        <div class="oldwrap"><span class="olbl">de <span class="old">R$ 199,90</span></span></div>
        <div class="nlbl">por</div>
        <div class="new"><span class="rs">R$</span>183<span class="cents">,91</span></div>
      </div>
      <div class="off"><div class="n">8%</div><div class="p">OFF</div><div class="l">DIA D</div></div>
    </div>
    <div class="note">✓ Frete grátis + Manual da Suplementação de brinde</div>
  </div>
</div>
</body></html>
