<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
#stage{position:relative;width:600px;height:600px;font-family:'Montserrat',sans-serif;display:flex;align-items:center;justify-content:center}
.seal{position:relative;width:520px;height:520px;border-radius:50%;
 background:radial-gradient(60% 60% at 50% 36%,#fbf8ef,#f1ead8 64%,#e9dfc7 100%);
 box-shadow:0 24px 60px rgba(60,50,20,.28), inset 0 0 0 3px rgba(196,154,69,.25);
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring{position:absolute;inset:20px;border-radius:50%;border:3px solid rgba(196,154,69,.9)}
.ring2{position:absolute;inset:30px;border-radius:50%;border:1.5px solid rgba(196,154,69,.4)}
.star{position:absolute;width:10px;height:10px;background:#c29a45;border-radius:2px;transform:rotate(45deg)}
.mk{width:50px;height:50px;margin-bottom:4px}
.kd{font-weight:800;font-size:26px;letter-spacing:6px;color:#b48a35;text-transform:uppercase}
.off{font-weight:900;font-size:118px;line-height:.84;letter-spacing:-3px;background:linear-gradient(180deg,#dcb154,#b6842f);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:150px;height:2px;background:linear-gradient(90deg,transparent,#c29a45,transparent);margin:12px 0}
.frete{font-weight:800;font-size:26px;letter-spacing:.5px;color:#2b357e}
.frete b{color:#3e7d5a}
.dias{margin-top:6px;font-weight:700;font-size:18px;letter-spacing:2px;color:#8a7a4e}
</style></head><body><div id="stage"><div class="seal">
<div class="ring"></div><div class="ring2"></div>
<div class="star" style="top:14px;left:50%;margin-left:-5px"></div><div class="star" style="bottom:14px;left:50%;margin-left:-5px"></div>
<div class="star" style="left:14px;top:50%;margin-top:-5px"></div><div class="star" style="right:14px;top:50%;margin-top:-5px"></div>
<img class="mk" src="brand/mono_indigo.png">
<div class="kd">Dia D</div>
<div class="off">8% OFF</div>
<div class="rule"></div>
<div class="frete"><b>FRETE GRÁTIS</b> + Manual de brinde</div>
<div class="dias">07 e 08.08 · só 2 dias</div>
</div></div></body></html>
