<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/montserrat.css">
<style>*{margin:0;padding:0;box-sizing:border-box}
#stage{position:relative;width:600px;height:600px;font-family:'Montserrat',sans-serif;display:flex;align-items:center;justify-content:center}
.seal{position:relative;width:520px;height:520px;border-radius:50%;background:radial-gradient(60% 60% at 50% 38%,#183021,#0e1a12 64%,#0a140c 100%);
 box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 0 0 3px rgba(178,232,64,.25), inset 0 0 60px rgba(164,217,46,.15);
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring{position:absolute;inset:20px;border-radius:50%;border:3px solid rgba(178,232,64,.9)}
.ring2{position:absolute;inset:30px;border-radius:50%;border:1.5px solid rgba(178,232,64,.4)}
.star{position:absolute;width:10px;height:10px;background:#a4d92e;border-radius:2px;transform:rotate(45deg)}
.mk{width:50px;height:50px;margin-bottom:4px}
.kd{font-weight:800;font-size:26px;letter-spacing:6px;color:#c7ee5a;text-transform:uppercase}
.off{font-weight:900;font-size:120px;line-height:.84;letter-spacing:-3px;background:linear-gradient(180deg,#c7ee5a,#8bc31f);-webkit-background-clip:text;background-clip:text;color:transparent}
.rule{width:150px;height:2px;background:linear-gradient(90deg,transparent,#a4d92e,transparent);margin:12px 0}
.frete{font-weight:800;font-size:26px;color:#f2f4ea}.frete b{color:#c7ee5a}
.dias{margin-top:6px;font-weight:700;font-size:18px;letter-spacing:2px;color:#aebba0}</style></head><body>
<div id="stage"><div class="seal"><div class="ring"></div><div class="ring2"></div>
<div class="star" style="top:14px;left:50%;margin-left:-5px"></div><div class="star" style="bottom:14px;left:50%;margin-left:-5px"></div>
<div class="star" style="left:14px;top:50%;margin-top:-5px"></div><div class="star" style="right:14px;top:50%;margin-top:-5px"></div>
<img class="mk" src="brand/mono_lime.png"><div class="kd">Dia D</div><div class="off">8% OFF</div><div class="rule"></div>
<div class="frete"><b>FRETE GRÁTIS</b> + Manual de brinde</div><div class="dias">07 e 08.08 · só 2 dias</div></div></div></body></html>
