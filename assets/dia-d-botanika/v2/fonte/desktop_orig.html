<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#05070f}
:root{--gold1:#e7c877;--gold2:#c9a24b;--goldln:#b9974a;--green1:#7BA05A;--green2:#5f8646;--cream:#f3efe2}
#stage{position:relative;width:1920px;height:600px;overflow:hidden;font-family:'Montserrat',sans-serif;
  background:
   radial-gradient(60% 90% at 22% 30%, #1a2b4d 0%, #142241 30%, #0d1730 60%, #081020 100%);}
.marble{position:absolute;inset:0;pointer-events:none;opacity:.6;mix-blend-mode:overlay;
  background:
   radial-gradient(30% 50% at 15% 20%, rgba(255,255,255,.10), transparent 60%),
   radial-gradient(40% 60% at 80% 80%, rgba(0,0,0,.4), transparent 60%),
   radial-gradient(25% 40% at 60% 15%, rgba(255,255,255,.06), transparent 60%)}
.veins{position:absolute;inset:0;pointer-events:none;opacity:.6}
.dust{position:absolute;pointer-events:none}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 130% at 40% 45%, transparent 52%, rgba(2,5,12,.7) 100%)}
.sprig{position:absolute;pointer-events:none}
.prod{position:absolute}
.prod img{display:block;height:100%;width:auto;filter:drop-shadow(0 22px 20px rgba(0,0,0,.55))}
.contact{position:absolute;border-radius:50%;background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.5), rgba(0,0,0,0) 72%);filter:blur(7px)}

/* right column */
.logo{position:absolute;top:40px;right:60px;z-index:6}
.logo img{height:40px}
.col{position:absolute;left:1180px;top:0;width:700px;height:600px;display:flex;flex-direction:column;justify-content:center;z-index:6}
.h1{font-weight:900;font-size:70px;line-height:.98;letter-spacing:.5px;color:#fff;text-transform:uppercase}
.sub{margin-top:20px;font-weight:600;font-size:33px;color:#eef2fb;letter-spacing:.2px}
.sub .off{font-weight:900;background:linear-gradient(180deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.frete{margin-top:26px;display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;padding:15px 46px;border-radius:44px;background:linear-gradient(135deg,var(--green1),var(--green2));color:#fff;font-weight:800;font-size:30px;letter-spacing:1px;box-shadow:0 10px 22px rgba(50,80,30,.3)}
.gift{margin-top:24px;font-weight:600;font-size:26px;color:#eef2fb}
.dias{margin-top:20px;font-weight:700;font-size:26px;color:#f3efe2}
.cta{margin-top:30px}
.cta a{display:inline-flex;align-items:center;justify-content:center;padding:18px 54px;border-radius:44px;background:linear-gradient(135deg,var(--green1),var(--green2));color:#fff;font-weight:800;font-size:26px;letter-spacing:.5px;text-decoration:none;box-shadow:0 14px 26px rgba(50,80,30,.34)}
</style></head>
<body>
<div id="stage">
  <div class="marble"></div>
  <!-- gold marble veins -->
  <svg class="veins" viewBox="0 0 1920 600" preserveAspectRatio="none">
    <g fill="none" stroke="url(#gv)" stroke-linecap="round">
      <path d="M-20 90 C 240 40, 360 150, 520 110 S 820 20, 1040 120 1300 70 1520 150 1940 90" stroke-width="1.6" opacity=".8"/>
      <path d="M120 -20 C 180 120, 90 220, 200 320 S 340 470, 300 620" stroke-width="1.3" opacity=".6"/>
      <path d="M-20 300 C 200 270, 360 340, 520 300" stroke-width="1" opacity=".4"/>
      <path d="M1500 -20 C 1560 120, 1470 220, 1560 340 1640 520 1600 620" stroke-width="1.2" opacity=".5"/>
      <path d="M900 620 C 940 500, 860 420, 940 300" stroke-width="1" opacity=".35"/>
    </g>
    <defs><linearGradient id="gv" x1="0" x2="1"><stop offset="0" stop-color="#b9974a" stop-opacity="0"/><stop offset=".5" stop-color="#e7c877" stop-opacity=".95"/><stop offset="1" stop-color="#b9974a" stop-opacity="0"/></linearGradient></defs>
  </svg>

  <!-- eucalyptus sprigs (left edge + scattered) -->
  <svg class="sprig" style="left:-30px;top:-30px;width:360px;height:360px;opacity:.92" viewBox="0 0 360 360">
    <g stroke="#3f6f4e" stroke-width="2.6" fill="none" opacity=".85"><path d="M-10 -10 C 90 70, 150 130, 190 250"/></g>
    <g fill="#4b7d59"><ellipse cx="40" cy="60" rx="26" ry="14" transform="rotate(40 40 60)"/><ellipse cx="72" cy="108" rx="26" ry="14" transform="rotate(46 72 108)"/><ellipse cx="104" cy="156" rx="24" ry="13" transform="rotate(54 104 156)"/><ellipse cx="132" cy="206" rx="22" ry="12" transform="rotate(62 132 206)"/><ellipse cx="20" cy="96" rx="22" ry="12" transform="rotate(20 20 96)"/><ellipse cx="52" cy="140" rx="22" ry="12" transform="rotate(28 52 140)"/></g>
    <g fill="#5f9068" opacity=".6"><ellipse cx="56" cy="52" rx="18" ry="10" transform="rotate(40 56 52)"/><ellipse cx="88" cy="98" rx="18" ry="10" transform="rotate(48 88 98)"/></g>
  </svg>
  <svg class="sprig" style="left:-20px;bottom:-40px;width:320px;height:320px;opacity:.9" viewBox="0 0 320 320">
    <g stroke="#3f6f4e" stroke-width="2.4" fill="none" opacity=".85"><path d="M-10 330 C 90 250, 150 190, 180 80"/></g>
    <g fill="#4b7d59"><ellipse cx="40" cy="250" rx="24" ry="13" transform="rotate(-34 40 250)"/><ellipse cx="72" cy="204" rx="24" ry="13" transform="rotate(-42 72 204)"/><ellipse cx="104" cy="158" rx="22" ry="12" transform="rotate(-50 104 158)"/><ellipse cx="132" cy="110" rx="20" ry="11" transform="rotate(-58 132 110)"/></g>
  </svg>
  <svg class="sprig" style="left:820px;top:170px;width:250px;height:200px;opacity:.42" viewBox="0 0 280 220">
    <g stroke="#3f6f4e" stroke-width="2.2" fill="none"><path d="M10 110 C 90 90, 170 120, 260 90"/></g>
    <g fill="#4b7d59"><ellipse cx="60" cy="96" rx="22" ry="12" transform="rotate(-10 60 96)"/><ellipse cx="110" cy="112" rx="22" ry="12" transform="rotate(6 110 112)"/><ellipse cx="165" cy="104" rx="20" ry="11" transform="rotate(-8 165 104)"/><ellipse cx="215" cy="96" rx="20" ry="11" transform="rotate(8 215 96)"/></g>
  </svg>

  <!-- gold capsules + dust -->
  <svg class="dust" style="left:900px;top:40px;width:520px;height:520px;opacity:.95" viewBox="0 0 520 520">
    <g><rect x="200" y="60" width="52" height="22" rx="11" fill="#e7c877" transform="rotate(-24 226 71)"/>
    <rect x="90" y="420" width="46" height="20" rx="10" fill="#d8b25a" transform="rotate(18 113 430)"/>
    <circle cx="60" cy="120" r="4" fill="#e7c877"/><circle cx="300" cy="150" r="3" fill="#f0d68f"/><circle cx="420" cy="90" r="3.4" fill="#e7c877"/><circle cx="360" cy="360" r="3" fill="#e7c877"/><circle cx="180" cy="300" r="2.6" fill="#f0d68f"/><circle cx="470" cy="300" r="3" fill="#e7c877"/><circle cx="120" cy="240" r="2.4" fill="#e7c877"/><circle cx="260" cy="460" r="3" fill="#e7c877"/></g>
  </svg>

  <!-- PRODUCTS grid -->
  <div class="contact" style="left:80px;bottom:300px;width:150px;height:24px"></div>
  <div class="contact" style="left:470px;bottom:300px;width:150px;height:24px"></div>
  <div class="contact" style="left:700px;bottom:300px;width:150px;height:24px"></div>
  <div class="contact" style="left:90px;bottom:44px;width:180px;height:28px"></div>
  <div class="contact" style="left:360px;bottom:44px;width:200px;height:30px"></div>
  <div class="contact" style="left:640px;bottom:44px;width:180px;height:28px"></div>
  <!-- top row -->
  <div class="prod" style="left:70px;bottom:320px;height:248px"><img src="prod/CAIXA_BOTANIKA_ADEK.png"></div>
  <div class="prod" style="left:300px;bottom:336px;height:216px"><img src="prod/ROTULO_BOTANIKA_TETRAVITD.png"></div>
  <div class="prod" style="left:470px;bottom:320px;height:248px"><img src="prod/CAIXA_BOTANIKA_VITAMINA_C.png"></div>
  <div class="prod" style="left:700px;bottom:328px;height:232px"><img src="prod/BOTANIKA_TRI_MG_ROTULO.png"></div>
  <!-- bottom row -->
  <div class="prod" style="left:80px;bottom:60px;height:250px"><img src="prod/ROTULO_BOTANIKA_WHEY_BALANCE.png"></div>
  <div class="prod" style="left:360px;bottom:60px;height:236px"><img src="prod/BOTANIKA_SUPER_OMEGA_ROTULO.png"></div>
  <div class="prod" style="left:620px;bottom:60px;height:236px"><img src="prod/ROTULO_BOTANIKA_CREATINA.png"></div>

  <!-- logo + text -->
  <div class="logo"><img src="brand/wordmark_cream.png"></div>
  <div class="col">
    <div class="h1">DIA D BOTANIKA</div>
    <div class="sub"><span class="off">8% OFF</span> em todos os suplementos</div>
    <div class="frete">FRETE GRÁTIS</div>
    <div class="gift">+ Manual da Suplementação de brinde</div>
    <div class="dias">07 e 08.08</div>
    <div class="cta"><a href="#">Aproveitar agora</a></div>
  </div>

  <div class="vign"></div>
</div>
</body></html>
