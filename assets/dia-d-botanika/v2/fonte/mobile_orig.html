<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#05070f}
:root{--gold1:#e7c877;--gold2:#c9a24b;--green1:#7BA05A;--green2:#5f8646;--cream:#f3efe2}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:'Montserrat',sans-serif;text-align:center;
  background:radial-gradient(70% 55% at 50% 24%, #1a2b4d 0%, #142241 32%, #0d1730 62%, #081020 100%);}
.marble{position:absolute;inset:0;pointer-events:none;opacity:.6;mix-blend-mode:overlay;
  background:radial-gradient(40% 30% at 25% 12%, rgba(255,255,255,.10), transparent 60%),radial-gradient(50% 40% at 80% 85%, rgba(0,0,0,.4), transparent 60%)}
.veins{position:absolute;inset:0;pointer-events:none;opacity:.6}
.dust{position:absolute;pointer-events:none}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 42%, transparent 56%, rgba(2,5,12,.72) 100%)}
.sprig{position:absolute;pointer-events:none}
.logo{margin:64px auto 0;display:flex;align-items:center;justify-content:center}
.logo img{height:46px}
.h1{margin-top:26px;font-weight:900;font-size:88px;line-height:.96;letter-spacing:.5px;color:#fff;text-transform:uppercase}
.sub{margin-top:18px;font-weight:600;font-size:42px;color:#eef2fb}
.sub .off{font-weight:900;background:linear-gradient(180deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.frete{margin-top:24px;display:inline-flex;align-items:center;justify-content:center;padding:18px 58px;border-radius:50px;background:linear-gradient(135deg,var(--green1),var(--green2));color:#fff;font-weight:800;font-size:38px;letter-spacing:1px;box-shadow:0 12px 24px rgba(50,80,30,.32)}
.gift{margin-top:20px;font-weight:600;font-size:31px;color:#eef2fb}
.dias{margin-top:12px;font-weight:700;font-size:30px;color:var(--cream)}
.stagep{position:relative;height:470px;margin-top:14px}
.prod{position:absolute}
.prod img{display:block;height:100%;width:auto;filter:drop-shadow(0 20px 18px rgba(0,0,0,.55))}
.contact{position:absolute;border-radius:50%;background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.5), rgba(0,0,0,0) 72%);filter:blur(7px)}
.cta{margin-top:18px}
.cta a{display:inline-flex;align-items:center;justify-content:center;padding:26px 78px;border-radius:60px;background:linear-gradient(135deg,var(--green1),var(--green2));color:#fff;font-weight:800;font-size:40px;letter-spacing:.5px;text-decoration:none;box-shadow:0 16px 30px rgba(50,80,30,.36)}
</style></head>
<body>
<div id="stage">
  <div class="marble"></div>
  <svg class="veins" viewBox="0 0 1080 1350" preserveAspectRatio="none">
    <g fill="none" stroke="url(#gv)" stroke-linecap="round">
      <path d="M-20 120 C 200 80, 340 180, 520 130 S 820 60, 1100 150" stroke-width="1.6" opacity=".7"/>
      <path d="M120 -20 C 60 200, 160 360, 90 560" stroke-width="1.3" opacity=".5"/>
      <path d="M980 -20 C 1040 220, 940 420, 1020 640" stroke-width="1.2" opacity=".5"/>
      <path d="M-20 980 C 260 940, 520 1010, 820 960 1040 930 1100 1000" stroke-width="1.4" opacity=".5"/>
    </g>
    <defs><linearGradient id="gv" x1="0" x2="1"><stop offset="0" stop-color="#b9974a" stop-opacity="0"/><stop offset=".5" stop-color="#e7c877" stop-opacity=".95"/><stop offset="1" stop-color="#b9974a" stop-opacity="0"/></linearGradient></defs>
  </svg>
  <svg class="sprig" style="left:-30px;top:60px;width:260px;height:300px;opacity:.7" viewBox="0 0 260 300"><path d="M-10 -10 C 80 70, 130 130, 160 250" stroke="#3f6f4e" stroke-width="2.6" fill="none"/><g fill="#4b7d59"><ellipse cx="40" cy="60" rx="24" ry="13" transform="rotate(44 40 60)"/><ellipse cx="72" cy="110" rx="24" ry="13" transform="rotate(52 72 110)"/><ellipse cx="102" cy="162" rx="22" ry="12" transform="rotate(60 102 162)"/></g></svg>
  <svg class="sprig" style="right:-30px;top:60px;width:260px;height:300px;opacity:.7;transform:scaleX(-1)" viewBox="0 0 260 300"><path d="M-10 -10 C 80 70, 130 130, 160 250" stroke="#3f6f4e" stroke-width="2.6" fill="none"/><g fill="#4b7d59"><ellipse cx="40" cy="60" rx="24" ry="13" transform="rotate(44 40 60)"/><ellipse cx="72" cy="110" rx="24" ry="13" transform="rotate(52 72 110)"/><ellipse cx="102" cy="162" rx="22" ry="12" transform="rotate(60 102 162)"/></g></svg>
  <svg class="dust" style="left:50%;transform:translateX(-50%);top:560px;width:900px;height:520px;opacity:.9" viewBox="0 0 900 520"><g><rect x="120" y="60" width="50" height="21" rx="10" fill="#e7c877" transform="rotate(-22 145 70)"/><rect x="740" y="420" width="46" height="20" rx="10" fill="#d8b25a" transform="rotate(18 763 430)"/><circle cx="60" cy="200" r="4" fill="#e7c877"/><circle cx="840" cy="160" r="3.4" fill="#e7c877"/><circle cx="420" cy="480" r="3" fill="#f0d68f"/><circle cx="820" cy="300" r="3" fill="#e7c877"/></g></svg>

  <div class="logo"><img src="brand/wordmark_cream.png"></div>
  <div class="h1">DIA D<br>BOTANIKA</div>
  <div class="sub"><span class="off">8% OFF</span> em todos os suplementos</div>
  <div class="frete">FRETE GRÁTIS</div>
  <div class="gift">+ Manual da Suplementação de brinde</div>
  <div class="dias">07 e 08.08</div>

  <div class="stagep">
    <div class="contact" style="left:130px;bottom:250px;width:150px;height:24px"></div>
    <div class="contact" style="left:470px;bottom:250px;width:150px;height:24px"></div>
    <div class="contact" style="left:770px;bottom:250px;width:150px;height:24px"></div>
    <div class="contact" style="left:150px;bottom:8px;width:190px;height:28px"></div>
    <div class="contact" style="left:440px;bottom:8px;width:210px;height:30px"></div>
    <div class="contact" style="left:730px;bottom:8px;width:190px;height:28px"></div>
    <!-- top row -->
    <div class="prod" style="left:120px;bottom:262px;height:210px"><img src="prod/CAIXA_BOTANIKA_ADEK.png"></div>
    <div class="prod" style="left:300px;bottom:274px;height:186px"><img src="prod/ROTULO_BOTANIKA_TETRAVITD.png"></div>
    <div class="prod" style="left:450px;bottom:262px;height:210px"><img src="prod/CAIXA_BOTANIKA_VITAMINA_C.png"></div>
    <div class="prod" style="left:700px;bottom:270px;height:198px"><img src="prod/BOTANIKA_TRI_MG_ROTULO.png"></div>
    <!-- bottom row -->
    <div class="prod" style="left:130px;bottom:24px;height:236px"><img src="prod/ROTULO_BOTANIKA_WHEY_BALANCE.png"></div>
    <div class="prod" style="left:420px;bottom:24px;height:224px"><img src="prod/BOTANIKA_SUPER_OMEGA_ROTULO.png"></div>
    <div class="prod" style="left:690px;bottom:24px;height:224px"><img src="prod/ROTULO_BOTANIKA_CREATINA.png"></div>
  </div>

  <div class="cta"><a href="#">Aproveitar agora</a></div>
  <div class="vign"></div>
</div>
</body></html>
