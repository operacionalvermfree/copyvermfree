<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#05070f}
:root{--lime1:#c7ee5a;--lime2:#a4d92e;--lime3:#8bc31f;--cream:#f2f4ea;--muted:#b9c6ad}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:'Montserrat',sans-serif;text-align:center;
  background:radial-gradient(100% 62% at 50% 64%, #17281a 0%, #0e1a12 46%, #080f09 100%)}
.aura{position:absolute;left:50%;bottom:180px;transform:translateX(-50%);width:1040px;height:640px;pointer-events:none;
  background:radial-gradient(46% 46% at 50% 50%, rgba(178,232,64,.55), rgba(164,217,46,.16) 44%, rgba(164,217,46,0) 72%);filter:blur(6px)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.06;background-image:radial-gradient(#fff 1px,transparent 1.4px);background-size:7px 7px}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 60%, transparent 46%, rgba(2,6,3,.8) 100%)}
.dust{position:absolute;pointer-events:none}
.logo{margin:70px auto 0;display:flex;align-items:center;justify-content:center}
.logo img{height:46px}
.kick{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:14px}
.kick .ln{width:40px;height:3px;background:var(--lime2)}
.kick span{font-weight:800;font-size:22px;letter-spacing:3px;color:var(--lime1);text-transform:uppercase}
.offer{margin-top:16px;display:flex;align-items:baseline;justify-content:center;gap:20px}
.offer .big{font-weight:900;font-size:250px;line-height:.78;letter-spacing:-8px;background:linear-gradient(180deg,var(--lime1),var(--lime3));-webkit-background-clip:text;background-clip:text;color:transparent}
.offer .rt{display:flex;flex-direction:column;align-items:flex-start}
.offer .rt .em{font-weight:900;font-size:74px;color:var(--cream);line-height:.86}
.offer .rt .sup{font-weight:600;font-size:34px;color:var(--muted);margin-top:6px;text-align:left;line-height:1.05}
.frow{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:0 50px}
.fretepill{display:inline-flex;align-items:center;gap:12px;padding:16px 32px;border-radius:14px;background:linear-gradient(135deg,var(--lime1),var(--lime3));color:#12280a;font-weight:900;font-size:32px;letter-spacing:.5px;box-shadow:0 12px 26px rgba(120,190,20,.4)}
.fretepill svg{width:27px;height:27px}
.gift{font-weight:700;font-size:28px;color:var(--cream)}
.gift .g{color:var(--lime1);font-weight:900}
.stagep{position:relative;height:440px;margin-top:6px}
.prod{position:absolute}
.prod img{display:block;height:100%;width:auto;filter:drop-shadow(0 0 16px rgba(164,217,46,.3)) drop-shadow(0 22px 20px rgba(0,0,0,.6))}
.contact{position:absolute;border-radius:50%;background:radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.6), rgba(0,0,0,0) 72%);filter:blur(7px)}
.cta{margin-top:22px}
.cta a{display:inline-flex;align-items:center;gap:14px;padding:26px 74px;border-radius:16px;background:linear-gradient(135deg,var(--lime1),var(--lime2));color:#12280a;font-weight:900;font-size:38px;letter-spacing:.6px;text-decoration:none;text-transform:uppercase;box-shadow:0 16px 30px rgba(120,190,20,.42)}
</style></head>
<body>
<div id="stage">
  <div class="aura"></div>
  <svg class="dust" style="left:60px;top:120px;width:960px;height:600px;opacity:.7" viewBox="0 0 960 600"><g fill="#c7ee5a"><circle cx="120" cy="80" r="4"/><circle cx="360" cy="40" r="3"/><circle cx="640" cy="90" r="4"/><circle cx="880" cy="180" r="3.4"/><circle cx="80" cy="360" r="3"/><circle cx="900" cy="420" r="3.6"/></g></svg>

  <div class="logo"><img src="brand/wordmark_cream.png"></div>
  <div class="kick"><span class="ln"></span><span>Dia D · 07 e 08.08</span><span class="ln"></span></div>
  <div class="offer"><div class="big">8%</div><div class="rt"><div class="em">OFF</div><div class="sup">em todos os<br>suplementos</div></div></div>
  <div class="frow">
    <span class="fretepill"><svg viewBox="0 0 24 24" fill="none" stroke="#12280a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>FRETE GRÁTIS</span>
    <span class="gift"><span class="g">+</span> Manual de brinde</span>
  </div>

  <div class="stagep">
    <div class="contact" style="left:170px;bottom:20px;width:200px;height:30px"></div>
    <div class="contact" style="left:420px;bottom:14px;width:220px;height:32px"></div>
    <div class="contact" style="left:680px;bottom:20px;width:190px;height:30px"></div>
    <!-- back boxes -->
    <div class="prod" style="left:150px;bottom:60px;height:300px;z-index:1;transform:rotate(-6deg)"><img src="prod/CAIXA_BOTANIKA_ADEK.png"></div>
    <div class="prod" style="left:330px;bottom:66px;height:250px;z-index:1;transform:rotate(5deg)"><img src="prod/BOTANIKA_SUPER_OMEGA_CAIXA.png"></div>
    <div class="prod" style="left:640px;bottom:60px;height:250px;z-index:1;transform:rotate(-5deg)"><img src="prod/BOTANIKA_CAIXA.png"></div>
    <div class="prod" style="left:800px;bottom:64px;height:250px;z-index:1;transform:rotate(6deg)"><img src="prod/BOTANIKA_TRI_MG_CAIXA.png"></div>
    <!-- front jars -->
    <div class="prod" style="left:150px;bottom:0;height:300px;z-index:3;transform:rotate(-7deg)"><img src="prod/ROTULO_BOTANIKA_WHEY_BALANCE.png"></div>
    <div class="prod" style="left:400px;bottom:2px;height:262px;z-index:3;transform:rotate(6deg)"><img src="prod/ROTULO_BOTANIKA_CREATINA.png"></div>
    <div class="prod" style="left:640px;bottom:4px;height:230px;z-index:3;transform:rotate(-5deg)"><img src="prod/BOTANIKA_SUPER_VITAMINA_C_ROTULO.png"></div>
    <div class="prod" style="left:820px;bottom:8px;height:236px;z-index:3;transform:rotate(9deg)"><img src="prod/ROTULO_BOTANIKA_TETRAVITD.png"></div>
  </div>

  <div class="cta"><a href="#">Aproveitar agora →</a></div>
  <div class="grain"></div>
  <div class="vign"></div>
</div>
</body></html>
