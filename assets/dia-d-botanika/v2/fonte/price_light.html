<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/montserrat.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
#stage{position:relative;width:820px;height:340px;font-family:'Montserrat',sans-serif;display:flex;align-items:center;justify-content:center}
.card{position:relative;width:760px;height:280px;border-radius:26px;background:linear-gradient(160deg,#fbf8ef,#f0e9d8);
 border:1.5px solid rgba(196,154,69,.4);box-shadow:0 22px 50px rgba(60,50,20,.22);padding:32px 40px;display:flex;flex-direction:column;justify-content:center}
.tagline{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tagline .mk{width:24px;height:24px}
.tagline span{font-weight:800;font-size:16px;letter-spacing:3px;color:#b48a35;text-transform:uppercase}
.row{display:flex;align-items:flex-end;gap:26px}
.olbl{font-weight:600;font-size:16px;color:#7a745f;letter-spacing:1px}
.old{font-weight:600;font-size:34px;color:#8f8a72;text-decoration:line-through;text-decoration-color:#d06d6d;text-decoration-thickness:3px}
.nlbl{font-weight:700;font-size:16px;color:#5a5648;letter-spacing:1px}
.new{font-weight:900;font-size:70px;line-height:.9;color:#2b357e;letter-spacing:-1px}
.new .cents{font-size:38px;vertical-align:top;font-weight:800}
.new .rs{font-size:34px;font-weight:800;color:#c29a45;vertical-align:top;margin-right:4px}
.off{margin-left:auto;align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;width:132px;height:132px;border-radius:24px;background:linear-gradient(160deg,#e6c874,#c99a3c);color:#2b2a12;transform:rotate(4deg);box-shadow:0 12px 24px rgba(160,120,40,.35)}
.off .n{font-weight:900;font-size:52px;line-height:.8}
.off .p{font-weight:900;font-size:26px;line-height:.8}
.off .l{font-weight:800;font-size:14px;letter-spacing:2px;margin-top:4px}
.note{margin-top:14px;font-weight:700;font-size:14px;color:#3e7d5a}
</style></head><body><div id="stage"><div class="card">
<div class="tagline"><img class="mk" src="brand/mono_indigo.png"><span>Preço Dia D</span></div>
<div class="row"><div>
 <div class="olbl">de <span class="old">R$ 199,90</span></div>
 <div class="nlbl">por</div>
 <div class="new"><span class="rs">R$</span>183<span class="cents">,91</span></div>
</div>
<div class="off"><div class="n">8%</div><div class="p">OFF</div><div class="l">DIA D</div></div></div>
<div class="note">✓ Frete grátis + Manual da Suplementação de brinde</div>
</div></div></body></html>
