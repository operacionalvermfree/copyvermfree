<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">

<style>

<img class="mk" src="brand/mono_cream.png">

<span><span class="off">8% OFF</span> em todos os suplementos</span><span class="dot"></span>
<span class="frete">FRETE GRÁTIS</span><span class="dot"></span><span>+ Manual da Suplementação de brinde</span></div>
</div></body></html>
